<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Dino Clutch</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><ellipse cx='8' cy='8' rx='5' ry='7' fill='%23fff1e8'/></svg>">
<script>window.onerror = function (m) { document.title = 'ERR ' + m; console.error(m); };</script>
<style>
  /* PICO-8 palette. One class per button type; colour comes from --c. */
  :root { --navy: #1d2b53; --white: #fff1e8; --blue: #29adff; --lime: #00e436; --orange: #ffa300; --red: #ff004d; --dgray: #5f574f; --panel-w: min(380px, 45vw); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #008751; touch-action: none; user-select: none; -webkit-user-select: none; }
  #game { position: fixed; inset: 0; height: 100dvh; }
  #game canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: var(--white);
         font: 700 15px/1.3 system-ui, sans-serif; text-shadow: 0 1px 3px #000; }
  #hud .ui { pointer-events: auto; }
  #ver { position: absolute; right: 8px; top: 2px; font-size: 11px; opacity: .6; }
  [hidden] { display: none !important; }

  .btn { --c: var(--blue); font: inherit; font-size: 13px; color: #000; text-shadow: none; background: var(--c); border: 2px solid #0008;
         border-radius: 999px; padding: 6px 12px; min-height: 34px; cursor: pointer; touch-action: manipulation; }
  .btn:disabled { filter: grayscale(1) brightness(.55); cursor: default; }
  .btn:not(:disabled):active { transform: translateY(1px); filter: brightness(.9); }
  .tab { --c: var(--dgray); flex: 1; font: inherit; font-size: 14px; color: var(--white); background: var(--c); border: 0;
         padding: 10px 4px; min-height: 40px; cursor: pointer; text-shadow: none; }
  #tabs { background: var(--navy); gap: 4px; padding: 4px 4px 0; }
  .tab { --c: #2c3a63; border-radius: 10px 10px 0 0; }
  .tab.on { --c: var(--orange); }
  .round { --c: var(--orange); width: 96px; height: 96px; border-radius: 50%; border: 3px solid #0008; background: var(--c);
           font: inherit; font-size: 20px; color: #000; text-shadow: none; cursor: pointer; touch-action: none; }
  .round.held { filter: brightness(1.15); transform: scale(.96); }

  #top { position: absolute; left: 0; right: 0; top: 0; padding: 8px 12px; display: flex; gap: 8px; justify-content: space-between; pointer-events: none; }
  #top > * { pointer-events: auto; }
  /* money and dino count sit on dark-green plaques (mock lowpoly16x9-farm) */
  #topL > :first-child, #pop { width: fit-content; background: #0d4a2bdd; border: 2px solid #3fae4a; border-radius: 12px; padding: 2px 10px; margin-bottom: 4px; }
  #money { font-size: 26px; line-height: 1.1; }
  #inc { font-size: 14px; color: var(--lime); margin-left: 6px; }
  #hint { color: var(--orange); min-height: 1.3em; }
  #egg { font-size: 12px; opacity: .9; }
  #topR { flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; padding-right: 0; margin-top: 14px; }
  #topR .btn { --c: var(--lime); animation: pulse 1.2s ease-in-out infinite; }
  #topR .btn.prest { --c: var(--orange); }
  #topR .btn.ad { --c: var(--blue); animation: none; white-space: nowrap; padding: 4px 10px; min-height: 30px; }
  #topR .btn.gift { --c: var(--orange); font-size: 18px; }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  .float { position: fixed; z-index: 4; transform: translate(-50%, -50%); font-size: 22px; color: var(--lime); pointer-events: none; animation: rise 1.2s ease-out forwards; }
  @keyframes rise { to { transform: translate(-50%, -140px); opacity: 0; } }
  #adov { position: absolute; inset: 0; z-index: 10; background: #000d; display: grid; place-items: center; text-align: center; pointer-events: auto; }
  #adov b { display: block; font-size: 36px; } #adov span { font-size: 18px; }
  #finger { position: fixed; z-index: 3; font-size: 40px; line-height: 1; transform: translateX(-50%); pointer-events: none; animation: bob .7s ease-in-out infinite alternate; }
  @keyframes bob { to { margin-top: 12px; } }
  .dbg { position: fixed; left: 6px; top: 46%; --c: var(--red); pointer-events: auto; opacity: .7; }
  .dbgbox { position: fixed; left: 62px; top: calc(46% - 60px); display: flex; flex-direction: column; gap: 6px; z-index: 6; pointer-events: auto; }

  #toast { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); background: #000a; border-radius: 12px; padding: 8px 16px;
           opacity: 0; transition: opacity .3s; text-align: center; pointer-events: none; }
  #toast.on { opacity: 1; }

  #bottom { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; pointer-events: none; }
  #hatchrow { align-self: center; display: flex; flex-direction: column; align-items: center; gap: 2px; margin-bottom: 8px; }
  #runb { font-size: 22px; color: var(--yellow, #ffec27); min-height: 1.3em; }
  #ring { --p: 100; width: 116px; height: 116px; border-radius: 50%; display: grid; place-items: center; pointer-events: auto;
          background: conic-gradient(var(--lime) calc(var(--p) * 1%), #0007 0); }
  #tabs { display: flex; pointer-events: auto; }
  #panel { display: none; background: #1d2b53ee; pointer-events: auto; overflow-y: auto; max-height: 30dvh; padding: 6px 10px; }
  #panel.open { display: block; }
  .pane { display: none; } .pane.on { display: block; }
  .row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; margin: 6px 0; background: #ffffff0d; border: 1px solid #fff2; border-radius: 10px; }
  .row .ico { width: 66px; height: 44px; flex-shrink: 0; object-fit: contain; }
  .row .info { flex: 1; min-width: 0; font-size: 13px; line-height: 1.25; }
  .row .info small { display: block; font-weight: 400; opacity: .8; font-size: 12px; }
  .row .acts { display: flex; flex-direction: column; gap: 4px; align-items: stretch; }
  .row .acts .btn { --c: #dfe3ea; white-space: nowrap; font-size: 12px; min-height: 30px; padding: 4px 10px; }
  .row .acts .btn.best { --c: var(--lime); }

  #modal { position: absolute; inset: 0; background: #0009; display: grid; place-items: center; pointer-events: auto; }
  #modal .box { background: var(--navy); border-radius: 14px; padding: 18px; width: min(320px, 86vw); text-align: center; }
  #modal p { margin: 0 0 14px; font-size: 16px; white-space: pre-line; }
  #modal .mbtns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  @media (min-aspect-ratio: 1/1) {
    #top { right: var(--panel-w); }
    #ver { left: 8px; right: auto; top: auto; bottom: 4px; }
    #bottom { left: auto; top: 0; width: var(--panel-w); }
    #hatchrow { position: fixed; left: 28px; bottom: 20px; margin: 0; pointer-events: none; }
    #panel { flex: 1; max-height: none; }
  }
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div id="top">
    <div id="topL">
      <div><span id="money"></span><span id="inc"></span></div>
      <div id="pop"></div>
      <div id="hint"></div>
      <div id="egg"></div>
    </div>
    <div id="topR">
      <button class="btn" id="newegg" hidden></button>
      <button class="btn prest" id="prest" hidden></button>
      <button class="btn gift" id="gift" hidden>🎁</button>
      <button class="btn ad" id="ad2x">×2 income (ad)</button>
    </div>
  </div>
  <div id="toast"></div>
  <div id="bottom">
    <div id="hatchrow">
      <div id="runb"></div>
      <div id="ring"><button class="round" id="hatch">HATCH</button></div>
    </div>
    <div id="tabs" class="ui">
      <button class="tab" data-tab="habs">Pens</button>
      <button class="tab" data-tab="vehs">Vehicles</button>
      <button class="tab" data-tab="res">Research</button>
    </div>
    <div id="panel">
      <div class="pane" id="p-habs"></div>
      <div class="pane" id="p-vehs"></div>
      <div class="pane" id="p-res"></div>
    </div>
  </div>
  <div id="modal" hidden>
    <div class="box"><p id="mtext"></p>
      <div class="mbtns"><button class="btn" id="mno" style="--c:var(--dgray);color:var(--white)">Cancel</button><button class="btn" id="mx" hidden style="--c:var(--lime)"></button><button class="btn" id="mok">OK</button></div>
    </div>
  </div>
  <div id="finger" hidden>👇</div>
  <div id="adov" hidden><div><b>TEST AD</b><span id="adn"></span></div></div>
  <div id="ver"></div>
</div>
<script src="game.js"></script>
</body>
</html>
