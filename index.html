<script>window.onerror = function (m) { document.title = 'ERR ' + m; console.error(m); };</script>
<style>
  /* ENDESGA 32 (lospec.com/palette-list/endesga-32): deep teal-green panels, cream buttons, orange + amber accents. One class per button type; colour comes from --c. */
  :root { --navy: #193c3e; --white: #ffffff; --blue: #ead4aa; --lime: #63c74d; --orange: #f77622; --red: #e43b44; --dgray: #3a4466; --yellow: #fee761; --amber: #feae34; --panel-w: clamp(320px, 30.6vw, 520px); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #265c42; touch-action: none; user-select: none; -webkit-user-select: none; }
  #game { position: fixed; inset: 0; height: 100dvh; }
  /* pinned screen shape the viewport doesn't match (layout.ts): body = centred 16:9 / 9:16 box, bars around it */
  html.boxed { background: #0b2a1f; --panel-w: clamp(320px, calc(var(--bw) * .306), 520px); }
  html.boxed body { position: fixed; left: 50%; top: 50%; width: var(--bw); height: var(--bh); transform: translate(-50%, -50%) scale(var(--bs)); }
  html.boxed #game { height: 100%; }
  #game canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: var(--white);
         font: 700 15px/1.3 system-ui, sans-serif; text-shadow: 0 1px 3px #000; }
  #hud .ui { pointer-events: auto; }
  [hidden] { display: none !important; }

  /* 3D look: top gloss gradient over --c, light top edge, dark bottom edge and a 3 px "thickness" shadow */
  .btn { --c: var(--blue); font: inherit; font-weight: 800; font-size: 13px; color: #1b2a1f; text-shadow: none;
         background: linear-gradient(#fff7, #fff0 55%, #0002), var(--c); border: 2px solid #0007; border-radius: 999px;
         box-shadow: inset 0 2px 0 #fff8, inset 0 -3px 0 #0003, 0 3px 0 #0006; padding: 6px 12px; min-height: 34px; cursor: pointer; touch-action: manipulation; }
  .btn:disabled { filter: grayscale(1) brightness(.55); cursor: default; }
  .btn:not(:disabled):active { transform: translateY(2px); box-shadow: inset 0 2px 0 #fff8, inset 0 -3px 0 #0003, 0 1px 0 #0006; filter: brightness(.92); }
  .film { width: 1.25em; height: 1.25em; vertical-align: -.25em; margin-right: .3em; flex-shrink: 0; }
  .tab { --c: #265c42; flex: 1; font: inherit; font-weight: 800; font-size: 14px; color: var(--white); border: 1.5px solid #63c74d66; border-radius: 12px;
         background: linear-gradient(#fff3, #fff0 50%, #0003), var(--c); box-shadow: inset 0 1px 0 #fff4, 0 2px 0 #0005;
         padding: 10px 4px; min-height: 40px; cursor: pointer; text-shadow: 0 2px 2px #0008; }
  #tabs { background: var(--navy); gap: 6px; padding: 6px 6px 0; }
  .tab.on { --c: var(--orange); border-color: #fee76199; background: linear-gradient(#fff7, #fff0 55%, #0002), linear-gradient(var(--amber), var(--c)); box-shadow: inset 0 2px 0 #fff8, inset 0 -3px 0 #0003, 0 2px 0 #0006; }
  /* HATCH: --R ring, dark underlay, thick green progress arc (10 % of the diameter), glossy orange button inside */
  #ring { --R: 116px; --p: 100; width: var(--R); height: var(--R); border-radius: 50%; display: grid; place-items: center; pointer-events: auto;
          background: #0b2a1f; box-shadow: 0 3px 0 #0006, inset 0 0 0 2px #0006; }
  .round { --c: var(--orange); width: 80%; height: 80%; border-radius: 50%; border: 0; font: inherit; font-weight: 800; font-size: calc(var(--R) * .19); color: #4a2306; text-shadow: 0 1px 0 #fee76188;
           background: radial-gradient(ellipse 60% 38% at 50% 22%, #fff9, #fff0), radial-gradient(circle at 50% 30%, var(--amber), var(--c) 80%);
           box-shadow: inset 0 -5px 0 #0003, 0 0 0 3px #0b2a1f; cursor: pointer; touch-action: none; }
  .round { display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; padding: 0; }
  .round:not(:disabled):active { filter: brightness(1.15); transform: scale(.96); }
  .round:disabled { filter: grayscale(.85) brightness(.7); cursor: default; }
  .round .eg2 { font-size: calc(var(--R) * .2); font-weight: 800; max-width: 90%; }
  /* egg icon: public/ui/eggs/<species>-<type>.png -> <type>.png (hud.ts setEgg picks the url), else a CSS egg in the type colour (--ec) */
  .eggi { display: block; flex-shrink: 0; background: var(--ei) center / contain no-repeat; }
  .eggi.css { background: radial-gradient(ellipse 40% 35% at 38% 30%, #fffa, #fff0), var(--ec); border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%; box-shadow: inset 0 -3px 0 #0003, 0 1px 0 #0005; }
  /* egg type switcher + incubator slots (above EGG) */
  #eggsw { display: flex; gap: 4px; pointer-events: auto; }
  .chip { flex: 1; display: flex; align-items: center; gap: 3px; justify-content: center; min-height: 28px; padding: 2px 8px 2px 5px; font-size: 12px; white-space: nowrap; }
  .chip .eggi { width: 15px; height: 19px; } .chip.on { --c: var(--lime); box-shadow: inset 0 2px 0 #fff8, inset 0 -3px 0 #0003, 0 0 0 3px #fee761, 0 3px 0 #0006; }
  .chip.lock { filter: grayscale(1) brightness(.6); cursor: default; }
  #incub { display: flex; gap: 6px; align-items: flex-start; justify-content: center; pointer-events: auto; }
  .slot { width: 56px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 800; }
  .sring { --p: 0; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle, #193c3e 0 56%, #0000 58%), conic-gradient(var(--lime) calc(var(--p) * 1%), #0b2a1f 0); box-shadow: 0 2px 0 #0006; }
  .sring > .eggi { width: 24px; height: 29px; }
  .slot.empty .sring { background: radial-gradient(circle, #193c3e99 0 56%, #0000 58%), #63c74d44; } .slot.empty .eggi { display: none; }
  .slot .btn.ad { --c: var(--blue); padding: 1px 6px; min-height: 22px; font-size: 11px; display: inline-flex; align-items: center; white-space: nowrap; }
  .slot .btn.ad .adt { white-space: pre-line; text-align: left; line-height: 1.1; } .slot .btn.ad .film { width: 1.4em; height: 1.4em; }
  .slot .btn.fin { --c: var(--lime); padding: 1px 6px; min-height: 22px; font-size: 11px; white-space: nowrap; }
  .slot .st { min-height: 1.2em; text-shadow: 0 1px 3px #000; }
  /* rarity banner + coloured floats */
  .rpop { position: fixed; z-index: 4; left: 50%; top: 34%; transform: translate(-50%, -50%); font-size: 40px; font-weight: 900; letter-spacing: 1px; color: var(--rc); pointer-events: none;
          text-shadow: 0 3px 0 #000a, 0 0 16px var(--rc); -webkit-text-stroke: 2px #0007; paint-order: stroke fill; animation: rpop 1.7s ease-out forwards; }
  .rpop.big { font-size: 66px; animation-duration: 2.4s; }
  .port .rpop { font-size: 30px; } .port .rpop.big { font-size: 40px; }
  @keyframes rpop { 0% { transform: translate(-50%, -50%) scale(.3); opacity: 0 } 12% { transform: translate(-50%, -50%) scale(1.25); opacity: 1 } 25% { transform: translate(-50%, -50%) scale(1) } 80% { opacity: 1 } to { transform: translate(-50%, -90%) scale(1); opacity: 0 } }
  .dots { display: flex; gap: 6px; align-items: center; margin-top: 2px; } .dots span { display: inline-flex; align-items: center; gap: 2px; font-size: 12px; font-weight: 800; } .dots span.z { opacity: .35; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--rc); box-shadow: inset 0 -2px 0 #0004, 0 0 0 1px #0006; }
  #ad2x { --c: #ffe07a; } #adptero { --c: #7ff0ff; } /* rewarded ads: squares in the left column with the gifts */
  .gbtn.adg { flex-direction: column; } .gbtn.adg .film { width: 24px; height: 24px; margin: 0; } .gbtn.adg .adt { white-space: nowrap; font-size: 11px; }

  #top { position: absolute; left: 0; right: 0; top: 0; padding: 8px 12px; display: flex; gap: 8px; justify-content: space-between; pointer-events: none; }
  #top > * { pointer-events: auto; }
  /* money and dino count sit on dark-green plaques (mock lowpoly16x9-farm) */
  /* the lime frame is an inset shadow, not a border: borders snap to device pixels (2px → 1.36px at dpr 1.475), the hudcap copy doesn't,
     so with a border every plaque in the canvas copy came out ~1 px taller and peeked out under the DOM one as a double plaque */
  #topL > :first-child, #vis, #pop { width: fit-content; background: linear-gradient(#ffffff1a, #ffffff00 60%), #193c3ee6; border-radius: 12px; padding: 4px 12px; margin-bottom: 4px;
                                     box-shadow: inset 0 0 0 2px #63c74d, inset 0 3px 0 #fff3, 0 2px 0 #0005; }
  #money { font-size: 26px; font-weight: 800; line-height: 1.1; }
  #inc { font-size: 14px; font-weight: 800; color: var(--lime); margin-left: 6px; }
  #vis { display: flex; align-items: center; gap: 6px; } #vis .ppl { width: 1.3em; height: 1.3em; display: none; flex-shrink: 0; }
  .row .acts .btn .bp { margin-left: .25em; }
  #hint { color: var(--orange); min-height: 1.3em; }
  #egg { font-size: 11px; width: fit-content; max-width: 190px; white-space: nowrap; background: #193c3edd; border-radius: 8px; padding: 1px 7px; line-height: 1.25; }
  /* landscape: one column, every plaque as wide as the widest, so widths don't jump with each digit */
  .land #topL { display: grid; width: fit-content; align-content: start; }
  .land #topL > :first-child, .land #vis, .land #pop, .land #egg { width: auto; max-width: none; box-sizing: border-box; }
  .land #egg { font-size: 19px; line-height: 1.3; padding: 2px 12px; border-radius: 12px; background: linear-gradient(#ffffff1a, #ffffff00 60%), #193c3ee6;
               box-shadow: inset 0 0 0 2px #63c74d, inset 0 3px 0 #fff3, 0 2px 0 #0005; }
  #topR { flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; padding-right: 0; margin-top: 14px; }
  #topR .btn { --c: var(--lime); animation: pulse 1.2s ease-in-out infinite; }
  #topR .btn.dbg { animation: none; }
  #topR .btn.prest { --c: var(--orange); }
  #topR .btn.ad { --c: var(--blue); animation: none; white-space: nowrap; padding: 4px 10px; min-height: 30px; display: inline-flex; align-items: center; }
  #mx { display: inline-flex; align-items: center; }
  #topR .btn.gift { --c: var(--orange); font-size: 18px; }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  .float { position: fixed; z-index: 4; transform: translate(-50%, -50%); font-size: 22px; color: var(--lime); pointer-events: none; animation: rise 1.2s ease-out forwards; }
  @keyframes rise { to { transform: translate(-50%, -140px); opacity: 0; } }
  #adov { position: absolute; inset: 0; z-index: 10; background: #000d; display: grid; place-items: center; text-align: center; pointer-events: auto; }
  #adov b { display: block; font-size: 36px; } #adov span { font-size: 18px; }
  #finger { position: fixed; z-index: 6; font-size: 40px; line-height: 1; transform: translateX(-50%); pointer-events: none; animation: bob .7s ease-in-out infinite alternate; }
  @keyframes bob { to { margin-top: 12px; } }
  .dbg { --c: var(--red); animation: none; pointer-events: auto; opacity: .7; width: 40px; height: 40px; padding: 0; font-size: 12px; }
  .toprow { display: flex; gap: 6px; position: relative; }
  .fps { align-self: center; color: #fff; font-weight: bold; font-size: 16px; -webkit-text-stroke: 3px #000; paint-order: stroke fill; white-space: nowrap; }
  .dbgbox { position: absolute; right: 0; top: 46px; display: flex; flex-direction: column; gap: 6px; z-index: 6; pointer-events: auto; }
  .vol { display: flex; align-items: center; gap: 8px; font-size: 16px; margin: 8px 0; } .vol span { width: 64px; text-align: left; } .vol input { flex: 1; min-width: 0; }

  #toast { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); background: #000a; border-radius: 12px; padding: 8px 16px;
           opacity: 0; transition: opacity .3s; text-align: center; pointer-events: none; }
  #toast.on { opacity: 1; }

  #bottom { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; pointer-events: none; }
  #brow { display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none; }
  #hatchrow { display: flex; flex-direction: column; align-items: center; gap: 5px; margin: 0 8px 8px 0; }
  /* zoom: vertical slider bottom left (as in ArkOfColors3D), top = closest */
  #zoomw { pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 4px; margin: 0 0 8px 8px;
           background: #193c3ecc; border: 2px solid #63c74d; border-radius: 16px; font-size: 18px; font-weight: 800; line-height: 1; }
  #zoom { writing-mode: vertical-lr; direction: rtl; height: 110px; width: 26px; margin: 0; padding: 0; -webkit-appearance: none; appearance: none; background: none; cursor: pointer; touch-action: none; }
  #zoom::-webkit-slider-runnable-track { width: 6px; border-radius: 3px; background: #ffffff55; }
  #zoom::-moz-range-track { width: 6px; border-radius: 3px; background: #ffffff55; }
  #zoom::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-left: -8px; border-radius: 50%; background: #fff; box-shadow: 0 2px 0 #0005; }
  #zoom::-moz-range-thumb { width: 22px; height: 22px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 2px 0 #0005; }
  #tabs { display: flex; pointer-events: auto; }
  #panel { display: none; background: #193c3ef5; pointer-events: auto; overflow-y: auto; max-height: 30dvh; padding: 6px 10px; }
  #panel.open { display: block; }
  .pane { display: none; } .pane.on { display: block; }
  .row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; margin: 6px 0; background: linear-gradient(#ffffff14, #ffffff06); border: 1.5px solid #63c74d55; border-radius: 12px; box-shadow: inset 0 1px 0 #fff2, 0 2px 0 #0004; }
  /* one icon tile for every tab: SVG glyph in --c, or a rendered tour <img>; data-l = level badge */
  .row .ico { --c: var(--lime); position: relative; width: 66px; height: 48px; flex-shrink: 0; box-sizing: border-box; display: grid; place-items: center; color: var(--c);
              border-radius: 10px; background: radial-gradient(#3b7a4f, #193c3e); border: 1.5px solid #63c74d88; box-shadow: inset 0 1px 0 #fff3; overflow: hidden; }
  .row .ico.dim { opacity: .45; }
  .row .ico svg { width: 70%; height: 80%; } .row .ico img { width: 100%; height: 100%; object-fit: contain; }
  .row .ico[data-l]::after { content: attr(data-l); position: absolute; right: 3px; bottom: 1px; font-size: 12px; line-height: 1; color: #fff; text-shadow: 0 1px 2px #000; }
  .row .info { flex: 1; min-width: 0; font-weight: 800; font-size: 14px; line-height: 1.2; }
  .row .info small { display: block; font-weight: 600; opacity: .8; font-size: 12px; }
  .row .info .nx { display: none; }
  .row .acts { display: flex; flex-direction: column; gap: 4px; align-items: stretch; }
  .row .acts .btn { --c: #c0cbdc; font-size: 12px; min-height: 30px; padding: 4px 10px; border-radius: 12px; line-height: 1.15; } /* label / name / price spans, see hud.ts setBtn */
  .row .acts .btn .bl { display: block; } .row .acts .btn .bn { white-space: nowrap; }
  .row .acts .btn.best { --c: var(--lime); }

  #modal, #sett { position: absolute; inset: 0; background: #0009; display: grid; place-items: center; pointer-events: auto; z-index: 5; }
  #modal .box, #sett .box { background: var(--navy); border-radius: 14px; padding: 18px; width: min(320px, 86vw); text-align: center; }
  #sett .box { position: relative; min-height: 120px; box-sizing: border-box; font-size: 22px; }
  #sclose { position: absolute; right: 8px; top: 8px; width: 34px; padding: 0; }
  #ver { position: absolute; right: 16px; bottom: 10px; font-size: 20px; } /* version: bottom right, large white, no date */
  #topR .btn.gear { --c: var(--blue); animation: none; width: 40px; height: 40px; padding: 0; font-size: 22px; line-height: 1; }
  #welcome { position: absolute; inset: 0; background: #0009; display: grid; place-items: center; pointer-events: auto; z-index: 9; }
  #welcome .box { background: var(--navy); border: 2px solid var(--lime); border-radius: 16px; padding: 18px; width: min(300px, 84vw); text-align: center; box-shadow: 0 4px 0 #0006; }
  #welcome img { width: 128px; height: 128px; border-radius: 22px; border: 2px solid #63c74d88; box-shadow: 0 3px 0 #0006; }
  #welcome h2 { margin: 10px 0 6px; font-size: 22px; } #welcome p { margin: 0 0 14px; font-size: 15px; font-weight: 600; }
  #welcome .btn { --c: var(--lime); min-width: 120px; font-size: 18px; }
  /* gifts: two square buttons over the zoom slider (fill = progress to the next gift, dot + pulse = something waits); popups as the ants game */
  #lcol { display: flex; flex-direction: column; align-items: flex-start; pointer-events: none; }
  #gifts { display: flex; flex-direction: column; gap: 8px; margin: 0 0 8px 8px; }
  .land #lcol { display: contents; } .land #gifts { position: fixed; left: 16px; bottom: 278px; margin: 0; }
  .gbtn { --c: var(--amber); --p: 0; position: relative; width: 54px; height: 54px; padding: 0; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 11px; line-height: 1; }
  .gbtn::before { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--p) * 1%); background: #63c74d99; }
  .gbtn > * { position: relative; } .gbtn svg { width: 26px; height: 26px; } .gbtn .gt { min-height: 11px; }
  #gplay { --c: #7ff0ff; }
  .gbtn .dot { position: absolute; right: 3px; top: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 2px #fff; display: none; }
  .gbtn.rdy { animation: pulse 1.2s ease-in-out infinite; } .gbtn.rdy .dot { display: block; }
  #gpop { position: absolute; inset: 0; background: #0009; display: grid; place-items: center; pointer-events: auto; z-index: 5; }
  #gpop .box { position: relative; background: var(--navy); border: 2px solid var(--lime); border-radius: 16px; padding: 14px 16px 16px; width: min(640px, 92vw); box-sizing: border-box; text-align: center; box-shadow: 0 4px 0 #0006; }
  #gpop h3 { margin: 0; font-size: 24px; } #gsub { font-size: 14px; opacity: .9; margin: 4px 0 10px; min-height: 1.3em; }
  #gx { position: absolute; right: 8px; top: 8px; width: 34px; padding: 0; }
  #gweek { display: grid; grid-template-columns: repeat(3, 1fr) 1.25fr; grid-template-rows: 1fr 1fr; gap: 8px; }
  #glist { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tile { font: inherit; color: var(--white); text-shadow: inherit; position: relative; background: linear-gradient(#ffffff14, #ffffff06), #0b2a1f; border: 2px solid #63c74d55; border-radius: 12px; padding: 6px 4px; cursor: pointer; touch-action: manipulation; box-shadow: 0 2px 0 #0005; }
  .tile.ready { border-color: var(--amber); background: linear-gradient(#feae3433, #feae3411), #3a3020; box-shadow: 0 0 0 2px #feae3466, 0 0 14px #feae34aa; }
  .tile.done { opacity: .5; } .tile.wait { opacity: .85; cursor: default; }
  .tile .gi { display: grid; place-items: center; color: var(--amber); } .tile .gi svg { width: 100%; height: 100%; } .tile .gi b { font-size: 24px; color: var(--lime); }
  .tile .mark { position: absolute; right: 5px; bottom: 3px; font-style: normal; font-size: 14px; line-height: 1; } .tile.done .mark { color: var(--lime); font-weight: 900; }
  .tile.card { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 96px; }
  .tile.card .mark { top: 4px; bottom: auto; }
  .tile.card .tt { font-size: 11px; opacity: .8; } .tile.card .gi { width: 60px; height: 60px; } .tile.card .gi .eggi { width: 54px; height: 64px; }
  #ginfo { position: absolute; inset: 0; border-radius: 14px; background: #000a; display: grid; place-items: center; z-index: 2; }
  #ginfo .ib { background: var(--navy); border: 2px solid var(--amber); border-radius: 14px; padding: 12px 14px; width: min(260px, 86%); display: flex; flex-direction: column; align-items: center; gap: 6px; box-shadow: 0 4px 0 #0006; }
  #ginfo .gi { width: 96px; height: 96px; display: grid; place-items: center; color: var(--amber); } #ginfo .gi .eggi { width: 84px; height: 100px; } #ginfo .gi svg { width: 100%; height: 100%; } #ginfo .gi b { font-size: 34px; color: var(--lime); }
  #ginfo b { font-size: 18px; } #ginfo p { margin: 0; font-size: 14px; } #ginfo small { font-size: 12px; opacity: .8; } #ginfo .btn { --c: var(--lime); min-width: 90px; margin-top: 4px; }
  .tile.card .amt { font-size: 16px; } .tile.card .cap { font-size: 11px; opacity: .75; min-height: 1em; }
  .tile.big { grid-column: 4; grid-row: 1 / 3; } .tile.big .gi { width: 80px; height: 80px; } .tile.big .gi .eggi { width: 66px; height: 80px; } .tile.big .amt { font-size: 22px; }
  .tile.rw { display: grid; grid-template-columns: 38px 1fr; grid-template-areas: "i a" "i b"; column-gap: 8px; row-gap: 3px; align-items: center; text-align: left; padding: 6px 8px; min-height: 52px; }
  .tile.rw .gi { grid-area: i; width: 38px; height: 38px; } .tile.rw .gi .eggi { width: 40px; height: 48px; } .tile.rw .gi b { font-size: 18px; }
  .tile.rw .amt { grid-area: a; font-size: 16px; line-height: 1; } .tile.rw .tt, .tile.rw .cap { display: none; }
  .tile.rw .bar { grid-area: b; position: relative; height: 16px; border-radius: 8px; background: #0b2a1f; box-shadow: inset 0 1px 3px #000a; overflow: hidden; }
